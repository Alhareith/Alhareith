name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ SECRETS.GITHUB_TOKEN }}
          user: Alhareith
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
